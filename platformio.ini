[platformio]
default_envs = esp32

[env]
build_flags = 
    -O1 
    -Werror
    -Wall
    -Wextra
    -Wpedantic
    #-Wconversion
    #-Wsign-conversion
    #-Wdouble-promotion
    #-Wfloat-equal
    #-Wshadow
    #-Wlogical-op
    #-Wswitch-enum
    #-Wundef
    #-Wnull-dereference
    #-Wzero-as-null-pointer-constant
    #-Wcast-align
    #-Wcast-qual
    #-Wold-style-cast
    #-Wnon-virtual-dtor
    #-Wredundant-decls
    #-Winit-self
    #-Wsuggest-override
    #-Woverloaded-virtual
    #-Wvla
    #-Wtrampolines
    #-Wpacked
    -fno-fast-math 
    #-fno-strict-aliasing 
    #-fno-omit-frame-pointer
    #-fno-threadsafe-statics
    #-fno-common
    #-fstack-protector-strong
cxx_flags = 
    -std=c++17
    -fno-exceptions 
    -fno-rtti
test_framework = unity

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    adafruit/Adafruit LSM9DS1 Library@^2.2.1
    adafruit/Adafruit VEML7700 Library@^2.1.6
    mikalhart/TinyGPSPlus@^1.1.0
build_unflags = -std=gnu++11 -std=c++11
build_flags = ${env.build_flags} -D CONFIG_FREERTOS_NUMBER_OF_CORES=2 

[env:desktop]
platform = native